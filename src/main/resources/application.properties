spring.application.name=PaymentClean

spring.config.import=optional:file:.env[.properties]

# Database credentials
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# mostrar sentencias SQL en la consola
spring.jpa.show-sql=true

# actualizar base de datos y crear entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configuración de Stripe
stripe.key.public=${STRIPE_PUBLIC_KEY}
stripe.key.secret=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
app.spei.expiration-hours=48
app.order.expiration-hours=${ORDER_EXPIRATION_HOURS:48}
app.order.expiration-check-ms=${ORDER_EXPIRATION_CHECK_MS:300000}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}


# Configuración de CFDI Express (CFDI 4.0 API: https://api.cfdi.express/v1)
cfdi.express.base-url=${CFDI_EXPRESS_BASE_URL:https://api.cfdi.express/v1}
cfdi.express.api-key=${CFDI_EXPRESS_API_KEY:}
cfdi.express.merchant-id=${CFDI_EXPRESS_MERCHANT_ID:}
cfdi.express.default-product-code=${CFDI_EXPRESS_PRODUCT_CODE:01010101}
cfdi.express.default-unit-code=${CFDI_EXPRESS_UNIT_CODE:H87}
app.emitter.cp=${EMITTER_ZIP_CODE:42501}

# Almacenamiento de facturas
app.invoices.storage-dir=${INVOICES_DIR:./data/invoices}

# Configuración JWT
jwt.secret=${JWT_SECRET:mi_clave_secreta_super_segura_de_al_menos_32_caracteres_123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
jwt.cookie.name=${JWT_COOKIE_NAME:auth_token}
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Strict}

# Configuración Mailtrap Java SDK (Email Sending API por defecto)
mailtrap.api.token=${MAILTRAP_TOKEN:}
mailtrap.sandbox=${MAILTRAP_SANDBOX:false}
mailtrap.inbox-id=${MAILTRAP_INBOX_ID:}
mailtrap.from.email=${MAILTRAP_FROM_EMAIL:hello@demomailtrap.com}
mailtrap.from.name=${MAILTRAP_FROM_NAME:Pasarela de Pagos}
mailtrap.override-to=${MAILTRAP_OVERRIDE_TO:}

# Actuator mail health deshabilitado al usar Mailtrap API SDK en lugar de SMTP
management.health.mail.enabled=false

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Scalar UI Configuration
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.page-title=Pasarela de Pagos API Reference
scalar.theme=purple

# Nivel general
logging.level.root=INFO

# Tus paquetes
logging.level.com.tutienda.pos=DEBUG

# Spring Security y Web
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# SQL / JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Stripe
logging.level.com.stripe=DEBUG

